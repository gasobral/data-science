[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "music_populatiry"
version = "0.0.1"
description = "predict music popularity using streaming data"
authors = [
  { name = "gabriel" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["music_populatiry"]
include = ["pyproject.toml", "music_populatiry/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["music_populatiry"]
force-sort-within-sections = true

