[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "client_segmentation"
version = "0.0.1"
description = "Client segmentation of brazlian e-commerce"
authors = [
  { name = "Gabriel Sobral" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10"


[tool.ruff]
line-length = 99
src = ["client_segmentation"]
include = ["pyproject.toml", "client_segmentation/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["client_segmentation"]
force-sort-within-sections = true

